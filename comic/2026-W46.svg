<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="560" fill="#f4efe3"/>
  <rect x="6" y="6" width="788" height="548" fill="none" stroke="#222" stroke-width="3"/>
  <!-- iceberg -->
  <g stroke="#222" stroke-width="3" stroke-linejoin="round">
    <polygon points="560,380 600,250 640,290 690,170 740,300 770,260 790,380" fill="#e3f0f5"/>
    <polygon points="690,170 740,300 700,330 670,260" fill="#c9e1ea"/>
  </g>
  <!-- sea -->
  <rect x="6" y="380" width="788" height="174" fill="#7fa6b8"/>
  <path d="M6 380 Q60 366 110 380 T210 380 T310 380 T410 380 T510 380 T610 380 T710 380 T794 380 L794 400 L6 400 Z" fill="#9bbccb" stroke="#222" stroke-width="2"/>
  <!-- ship, tilted -->
  <g transform="rotate(-12 300 380)" stroke="#222" stroke-width="3" stroke-linejoin="round">
    <polygon points="70,360 560,360 520,440 120,440" fill="#6b3b2a"/>
    <rect x="130" y="320" width="380" height="40" fill="#e8dcc0"/>
    <circle cx="170" cy="340" r="9" fill="#9bbccb"/><circle cx="210" cy="340" r="9" fill="#9bbccb"/>
    <circle cx="250" cy="340" r="9" fill="#9bbccb"/><circle cx="290" cy="340" r="9" fill="#9bbccb"/>
    <rect x="360" y="270" width="100" height="50" fill="#d9ccaa"/>
    <rect x="395" y="215" width="34" height="55" fill="#b84a3a"/>
    <line x1="60" y1="360" x2="570" y2="360" stroke-width="4"/>
  </g>
  <!-- bow gash and water -->
  <path d="M470 405 L520 392 L540 410 L500 420 Z" fill="#7fa6b8" stroke="#222" stroke-width="2"/>
  <!-- captain (on bow deck) -->
  <g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="225" y="205" width="52" height="82" rx="8" fill="#1f3a5f"/>
    <circle cx="251" cy="185" r="22" fill="#f1c9a5"/>
    <path d="M227 176 Q251 146 275 176 Z" fill="#1f3a5f"/>
    <rect x="224" y="173" width="54" height="8" fill="#e8dcc0"/>
    <path d="M241 192 q10 8 20 0" fill="none"/>
    <circle cx="243" cy="184" r="2" fill="#222"/><circle cx="259" cy="184" r="2" fill="#222"/>
    <line x1="277" y1="225" x2="318" y2="196" stroke-width="8"/>
    <polygon points="312,184 340,176 336,212 322,206" fill="#c9c9c9"/>
    <line x1="228" y1="240" x2="205" y2="272"/>
    <rect x="228" y="285" width="18" height="44" fill="#1f3a5f"/><rect x="256" y="285" width="18" height="44" fill="#1f3a5f"/>
  </g>
  <!-- navigator / chief of staff -->
  <g transform="translate(60 0)" stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="350" y="228" width="50" height="78" rx="8" fill="#3a3a3a"/>
    <circle cx="375" cy="208" r="21" fill="#f1c9a5"/>
    <path d="M354 202 Q375 184 396 202" fill="#222"/>
    <line x1="366" y1="208" x2="370" y2="208"/><line x1="382" y1="208" x2="386" y2="208"/>
    <path d="M367 218 h16" fill="none"/>
    <rect x="352" y="250" width="46" height="24" fill="#fff" stroke-width="2"/>
    <rect x="352" y="300" width="18" height="30" fill="#3a3a3a"/><rect x="380" y="300" width="18" height="30" fill="#3a3a3a"/>
    <line x1="350" y1="245" x2="332" y2="262"/>
  </g>
  <text x="435" y="260" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">CHIEF</text><text x="435" y="270" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">OF STAFF</text>
  <!-- chart held up -->
  <g stroke="#222" stroke-width="3" stroke-linejoin="round">
    <polygon points="280,236 372,226 380,316 288,326" fill="#fffaf0"/>
  </g>
  <text x="334" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#222" transform="rotate(-8 323 280)">NEW COURSE:</text>
  <text x="328" y="274" font-size="14" font-weight="bold" text-anchor="middle" fill="#a8301f" transform="rotate(-8 323 284)">SAME</text>
  <text x="328" y="292" font-size="14" font-weight="bold" text-anchor="middle" fill="#a8301f" transform="rotate(-8 323 298)">ICEBERG,</text>
  <text x="328" y="310" font-size="14" font-weight="bold" text-anchor="middle" fill="#a8301f" transform="rotate(-8 323 312)">FASTER</text>
  <!-- speech bubble -->
  <g stroke="#222" stroke-width="3" stroke-linejoin="round">
    <path d="M40 40 H520 Q540 40 540 60 V130 Q540 150 520 150 H300 L262 160 L252 150 H60 Q40 150 40 130 V60 Q40 40 60 40 Z" fill="#fff"/>
  </g>
  <text x="290" y="82" font-size="26" font-weight="bold" text-anchor="middle" fill="#222">“We will be back,</text>
  <text x="290" y="118" font-size="26" font-weight="bold" text-anchor="middle" fill="#222">bigger and stronger than ever!”</text>
  <!-- passengers in water -->
  <g stroke="#222" stroke-width="3" stroke-linecap="round" fill="#f1c9a5">
    <circle cx="90" cy="440" r="17"/><line x1="73" y1="452" x2="52" y2="418" fill="none"/><line x1="107" y1="452" x2="128" y2="418" fill="none"/>
    <circle cx="170" cy="490" r="17"/><line x1="153" y1="500" x2="132" y2="470" fill="none"/>
    <circle cx="430" cy="470" r="17"/><line x1="447" y1="480" x2="468" y2="446" fill="none"/>
    <circle cx="640" cy="450" r="17"/><line x1="657" y1="460" x2="678" y2="426" fill="none"/><line x1="623" y1="460" x2="602" y2="426" fill="none"/>
  </g>
  <g fill="#222">
    <circle cx="84" cy="438" r="2"/><circle cx="96" cy="438" r="2"/>
    <circle cx="164" cy="488" r="2"/><circle cx="176" cy="488" r="2"/>
    <circle cx="424" cy="468" r="2"/><circle cx="436" cy="468" r="2"/>
    <circle cx="634" cy="448" r="2"/><circle cx="646" cy="448" r="2"/>
  </g>
  <g stroke="#222" stroke-width="2" fill="none"><path d="M82 450 q8 6 16 0"/><path d="M162 500 q8 6 16 0"/><path d="M422 480 q8 6 16 0"/><path d="M632 460 q8 6 16 0"/></g>
  <!-- sign floating -->
  <g stroke="#222" stroke-width="3" stroke-linejoin="round">
    <polygon points="470,490 640,478 646,528 476,540" fill="#fffaf0"/>
  </g>
  <text x="558" y="506" font-size="15" font-weight="bold" text-anchor="middle" fill="#222" transform="rotate(-4 558 510)">THE VOTERS</text>
  <text x="558" y="526" font-size="15" font-weight="bold" text-anchor="middle" fill="#a8301f" transform="rotate(-4 558 525)">JUST DIDN'T GET IT</text>
</svg>
