<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760">
  <title>Frozen Assets</title>
  <defs>
    <clipPath id="frame"><rect x="6" y="6" width="988" height="748"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" stroke-linecap="round" stroke-linejoin="round">
    <!-- paper -->
    <rect x="0" y="0" width="1000" height="760" fill="#f7f2e7"/>

    <!-- Trieste hills and town -->
    <path d="M0,360 Q120,320 240,345 Q360,370 470,335 Q600,300 720,330 Q860,362 1000,318 L1000,472 L0,472 Z" fill="#e2dccd" stroke="#9a9384" stroke-width="2"/>
    <g fill="#ece6d8" stroke="#9a9384" stroke-width="2">
      <rect x="30" y="372" width="34" height="40"/>
      <rect x="70" y="360" width="26" height="52"/>
      <rect x="102" y="378" width="40" height="34"/>
      <path d="M150,370 L172,352 L194,370 L194,412 L150,412 Z"/>
      <rect x="912" y="352" width="30" height="50"/>
      <rect x="948" y="366" width="40" height="36"/>
    </g>
    <g stroke="#9a9384" stroke-width="2">
      <line x1="40" y1="384" x2="54" y2="384"/><line x1="78" y1="372" x2="88" y2="372"/>
      <line x1="78" y1="388" x2="88" y2="388"/><line x1="112" y1="392" x2="132" y2="392"/>
      <line x1="920" y1="366" x2="934" y2="366"/><line x1="956" y1="380" x2="980" y2="380"/>
    </g>

    <!-- gulls -->
    <g stroke="#555" stroke-width="2.5" fill="none">
      <path d="M840,120 q12,-12 22,0 q10,-12 22,0"/>
      <path d="M900,170 q9,-9 17,0 q8,-9 17,0"/>
    </g>

    <!-- masts (drawn first so the deckhouse sits on them) -->
    <g stroke="#3b3f44" stroke-width="10">
      <line x1="330" y1="372" x2="330" y2="-20"/>
      <line x1="525" y1="362" x2="525" y2="-20"/>
      <line x1="720" y1="370" x2="720" y2="-20"/>
    </g>
    <g stroke="#3b3f44" stroke-width="1.6" fill="none">
      <line x1="330" y1="10" x2="175" y2="398"/>
      <line x1="330" y1="10" x2="525" y2="60"/>
      <line x1="525" y1="10" x2="720" y2="60"/>
      <line x1="720" y1="10" x2="868" y2="392"/>
      <line x1="525" y1="10" x2="430" y2="360"/>
      <line x1="525" y1="10" x2="620" y2="360"/>
    </g>

    <!-- hull of Sailing Yacht A (reverse bow) -->
    <path d="M150,402 L866,388 L906,474 L190,482 Q160,448 150,402 Z" fill="#848c93" stroke="#222" stroke-width="3.5"/>
    <path d="M168,428 L880,416" stroke="#5c646b" stroke-width="2.5" fill="none"/>
    <!-- deckhouse -->
    <path d="M290,402 L326,360 L706,354 L770,398 Z" fill="#5e666d" stroke="#222" stroke-width="3"/>
    <path d="M335,378 L700,372 L722,386 L325,392 Z" fill="#2c3136" stroke="none"/>
    <path d="M420,358 L444,330 L604,328 L634,356 Z" fill="#6c747b" stroke="#222" stroke-width="3"/>
    <path d="M452,342 L598,340" stroke="#2c3136" stroke-width="6"/>
    <!-- hull name -->
    <text x="836" y="450" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#eef0f1">A</text>

    <!-- air conditioners on the aft deck, running flat out -->
    <g stroke="#222" stroke-width="2.5" fill="#e9ecee">
      <rect x="172" y="366" width="62" height="36" rx="3"/>
      <rect x="240" y="366" width="62" height="36" rx="3"/>
      <rect x="206" y="328" width="62" height="36" rx="3"/>
    </g>
    <g stroke="#222" stroke-width="1.8" fill="none">
      <circle cx="190" cy="384" r="12"/><circle cx="258" cy="384" r="12"/><circle cx="224" cy="346" r="12"/>
      <circle cx="190" cy="384" r="7"/><circle cx="190" cy="384" r="2" fill="#222"/>
      <circle cx="258" cy="384" r="7"/><circle cx="258" cy="384" r="2" fill="#222"/>
      <circle cx="224" cy="346" r="7"/><circle cx="224" cy="346" r="2" fill="#222"/>
      <path d="M208,374 h20 M208,381 h20 M208,388 h20 M208,395 h20"/>
      <path d="M276,374 h20 M276,381 h20 M276,388 h20 M276,395 h20"/>
      <path d="M242,336 h20 M242,343 h20 M242,350 h20 M242,357 h20"/>
    </g>
    <!-- cold air and snowflakes -->
    <g stroke="#6aa3c4" stroke-width="2.5" fill="none">
      <path d="M200,320 q-12,-10 -4,-22"/>
      <path d="M236,318 q0,-12 8,-22"/>
      <path d="M274,320 q12,-10 4,-22"/>
    </g>
    <g stroke="#6aa3c4" stroke-width="2.5">
      <path d="M150,300 l16,0 M158,292 l0,16 M152,294 l12,12 M164,294 l-12,12"/>
      <path d="M232,268 l16,0 M240,260 l0,16 M234,262 l12,12 M246,262 l-12,12"/>
      <path d="M310,296 l16,0 M318,288 l0,16 M312,290 l12,12 M324,290 l-12,12"/>
      <path d="M190,250 l12,0 M196,244 l0,12"/>
      <path d="M286,240 l12,0 M292,234 l0,12"/>
    </g>
    <!-- icicles along the gunwale -->
    <g fill="#e6f1f6" stroke="#6aa3c4" stroke-width="1.8">
      <path d="M156,404 l8,0 l-4,22 Z"/>
      <path d="M176,404 l10,0 l-5,30 Z"/>
      <path d="M200,403 l8,0 l-4,18 Z"/>
      <path d="M222,403 l10,0 l-5,26 Z"/>
      <path d="M248,403 l8,0 l-4,16 Z"/>
      <path d="M270,402 l10,0 l-5,24 Z"/>
      <path d="M298,402 l8,0 l-4,14 Z"/>
    </g>

    <!-- tiny crew scrubbing the hull on bosun's chairs -->
    <g stroke="#222" stroke-width="2">
      <line x1="470" y1="400" x2="470" y2="420"/>
      <line x1="640" y1="397" x2="640" y2="418"/>
    </g>
    <g stroke="#222" stroke-width="2.5" fill="#f1d2b4">
      <rect x="460" y="420" width="20" height="5" fill="#8a6a44"/>
      <circle cx="470" cy="434" r="6"/>
      <path d="M470,440 L470,456 M470,446 L458,442 M470,446 L456,452" fill="none"/>
      <rect x="630" y="418" width="20" height="5" fill="#8a6a44"/>
      <circle cx="640" cy="432" r="6"/>
      <path d="M640,438 L640,454 M640,444 L652,440 M640,444 L654,450" fill="none"/>
    </g>
    <g stroke="#222" stroke-width="2" fill="#e7c64b">
      <rect x="451" y="438" width="7" height="9"/>
      <rect x="652" y="436" width="7" height="9"/>
    </g>
    <g fill="none" stroke="#8fb7cc" stroke-width="2">
      <path d="M447,456 q4,6 0,12"/><path d="M660,452 q4,6 0,12"/>
    </g>

    <!-- water -->
    <rect x="0" y="472" width="1000" height="106" fill="#bccbd0"/>
    <path d="M180,482 L908,474" stroke="#222" stroke-width="3" fill="none"/>
    <g stroke="#7f979f" stroke-width="2.5" fill="none">
      <path d="M30,500 q20,-6 40,0 t40,0"/>
      <path d="M260,520 q20,-6 40,0 t40,0"/>
      <path d="M560,505 q20,-6 40,0 t40,0"/>
      <path d="M820,530 q20,-6 40,0 t40,0"/>
      <path d="M120,548 q20,-6 40,0 t40,0"/>
      <path d="M700,556 q20,-6 40,0 t40,0"/>
      <path d="M430,560 q20,-6 40,0 t40,0"/>
    </g>
    <!-- reflection of hull -->
    <path d="M200,490 L890,484 L880,500 L230,506 Z" fill="#a3b3b9"/>

    <!-- quay -->
    <rect x="0" y="578" width="1000" height="190" fill="#ddd3bf"/>
    <rect x="0" y="578" width="1000" height="20" fill="#c6b99f" stroke="#222" stroke-width="3"/>
    <g stroke="#b3a68c" stroke-width="2">
      <line x1="90" y1="598" x2="60" y2="760"/><line x1="260" y1="598" x2="245" y2="760"/>
      <line x1="470" y1="598" x2="470" y2="760"/><line x1="690" y1="598" x2="705" y2="760"/>
      <line x1="880" y1="598" x2="910" y2="760"/>
      <line x1="0" y1="680" x2="1000" y2="680"/>
    </g>

    <!-- bollard and mooring line -->
    <path d="M100,606 Q100,590 120,590 Q140,590 140,606 L136,640 L104,640 Z" fill="#3b3f44" stroke="#222" stroke-width="3"/>
    <path d="M118,596 Q140,520 168,440" stroke="#7a5a32" stroke-width="5" fill="none"/>

    <!-- REPORTER, facing right -->
    <g stroke="#222" stroke-width="3">
      <!-- legs -->
      <path d="M312,668 L306,738" stroke-width="9" fill="none"/>
      <path d="M342,668 L348,738" stroke-width="9" fill="none"/>
      <path d="M296,742 Q306,734 316,742 Z" fill="#222"/>
      <path d="M342,742 Q354,734 364,742 Z" fill="#222"/>
      <!-- trench coat -->
      <path d="M296,566 Q326,552 356,566 L372,684 L282,684 Z" fill="#cdb48a"/>
      <path d="M326,566 L326,684" fill="none" stroke-width="2"/>
      <path d="M288,632 L364,632" fill="none" stroke-width="2.5"/>
      <!-- arms holding notepad -->
      <path d="M352,578 Q372,610 378,616" fill="none" stroke-width="12" stroke="#b79d72"/>
      <path d="M300,580 Q316,618 354,624" fill="none" stroke-width="12" stroke="#b79d72"/>
      <rect x="352" y="596" width="30" height="40" fill="#fffdf5" transform="rotate(-12 367 616)"/>
      <path d="M358,606 l16,-3 M359,614 l16,-3 M360,622 l12,-2" stroke-width="1.5" fill="none" transform="rotate(-12 367 616)"/>
      <path d="M382,604 L392,588" stroke-width="3" fill="none"/>
      <!-- neck and head -->
      <rect x="318" y="544" width="16" height="16" fill="#e8c09c"/>
      <ellipse cx="326" cy="518" rx="28" ry="32" fill="#e8c09c"/>
      <!-- hair with bun -->
      <path d="M298,520 Q294,482 330,484 Q356,486 354,508 Q336,494 312,506 Q304,516 298,520 Z" fill="#5a3b26"/>
      <circle cx="300" cy="488" r="13" fill="#5a3b26"/>
      <!-- face: skeptical -->
      <circle cx="342" cy="516" r="2.6" fill="#222"/>
      <path d="M334,503 L350,507" fill="none" stroke-width="2.5"/>
      <path d="M352,520 L358,530 L350,532" fill="none" stroke-width="2.5"/>
      <path d="M338,540 L350,538" fill="none" stroke-width="2.5"/>
    </g>

    <!-- OFFICIAL, facing left, gesturing up at the yacht -->
    <g stroke="#222" stroke-width="3">
      <!-- legs -->
      <rect x="532" y="676" width="30" height="62" fill="#2e323b"/>
      <rect x="572" y="676" width="30" height="62" fill="#2e323b"/>
      <ellipse cx="540" cy="742" rx="24" ry="9" fill="#151515"/>
      <ellipse cx="588" cy="742" rx="22" ry="9" fill="#151515"/>
      <!-- suit, portly -->
      <path d="M522,574 Q566,556 612,574 Q636,628 618,684 L518,684 Q500,628 522,574 Z" fill="#3a3f4a"/>
      <!-- shirt and tie -->
      <path d="M552,566 L566,600 L580,566 Z" fill="#fbfaf6"/>
      <path d="M564,576 L568,576 L572,610 L566,618 L560,610 Z" fill="#8b2a2a" stroke-width="2"/>
      <!-- tricolour sash -->
      <g stroke="none">
        <path d="M604,570 L620,582 L534,684 L516,672 Z" fill="#2f8a4c"/>
        <path d="M615,578 L626,588 L546,684 L530,684 Z" fill="#fbfaf6"/>
        <path d="M622,586 L630,596 L556,684 L542,684 Z" fill="#c8323a"/>
      </g>
      <path d="M604,570 L620,582 L534,684 M630,596 L556,684" fill="none" stroke-width="2"/>
      <!-- lowered arm -->
      <path d="M610,584 Q628,624 620,654" fill="none" stroke-width="20" stroke="#3a3f4a"/>
      <circle cx="619" cy="662" r="10" fill="#f1d2b4"/>
      <!-- raised arm, sweeping toward the yacht -->
      <path d="M528,584 Q500,560 478,512" fill="none" stroke-width="20" stroke="#3a3f4a"/>
      <path d="M468,506 Q462,488 474,480 Q482,486 480,494 L492,486 Q498,494 488,506 Z" fill="#f1d2b4"/>
      <!-- neck and head -->
      <rect x="556" y="550" width="22" height="14" fill="#f1d2b4"/>
      <ellipse cx="566" cy="520" rx="34" ry="36" fill="#f1d2b4"/>
      <!-- bald dome, side hair -->
      <path d="M592,506 Q604,514 598,534" fill="none" stroke="#6b6b6b" stroke-width="7"/>
      <path d="M538,506 Q530,512 534,528" fill="none" stroke="#6b6b6b" stroke-width="6"/>
      <!-- ear -->
      <ellipse cx="598" cy="522" rx="6" ry="10" fill="#f1d2b4"/>
      <!-- eyes closed, very pleased -->
      <path d="M540,512 q6,-5 12,0" fill="none" stroke-width="2.5"/>
      <path d="M558,512 q6,-5 12,0" fill="none" stroke-width="2.5"/>
      <!-- nose -->
      <path d="M548,518 Q532,528 546,534" fill="#f1d2b4" stroke-width="2.5"/>
      <!-- moustache -->
      <path d="M534,540 Q546,532 556,538 Q566,532 576,540 Q566,546 556,542 Q546,548 534,540 Z" fill="#555"/>
      <!-- open mouth, mid-sentence -->
      <path d="M548,548 Q556,556 564,548" fill="#7a2a2a" stroke-width="2"/>
    </g>

    <!-- motion marks for the gesture -->
    <g stroke="#222" stroke-width="2.5" fill="none">
      <path d="M452,486 q-10,-6 -18,-2"/>
      <path d="M456,470 q-8,-10 -16,-10"/>
    </g>

    <!-- sign on the quay -->
    <g stroke="#222" stroke-width="3">
      <rect x="740" y="670" width="12" height="76" fill="#7a5a32"/>
      <rect x="912" y="670" width="12" height="76" fill="#7a5a32"/>
      <rect x="676" y="590" width="304" height="114" fill="#fffdf5"/>
      <rect x="684" y="598" width="288" height="98" fill="none" stroke-width="1.5"/>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="middle">
      <text x="828" y="630" font-size="29" font-weight="bold" fill="#a3262d">SEQUESTERED</text>
      <text x="828" y="659" font-size="23">Upkeep: $30,000 a day</text>
      <text x="828" y="686" font-size="23">Paid by: taxpayers</text>
    </g>
  </g>
  <rect x="6" y="6" width="988" height="748" fill="none" stroke="#222" stroke-width="4"/>
</svg>
